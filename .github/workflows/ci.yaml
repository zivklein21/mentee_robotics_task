name: ci-flow-ziv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -v -s tests

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      existing: ${{ steps.ver.outputs.existing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Compute Version (With PSR)
        id: ver
        shell: bash
        run: |
          VERSION=$(uvx --from "python-semantic-release==10.*" semantic-release -c releaserc.toml version --print | tail -n1)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::PSR returned invalid version: '$VERSION'"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already released - skipping build, tag and deploy"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
            echo "New version: $VERSION"
          fi

  build-push:
    needs: release
    if: needs.release.outputs.existing != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        run: echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${VERSION}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"
          for i in $(seq 1 15); do curl -fs localhost:8080/health && break; sleep 1; done
          got=$(curl -fs localhost:8080/version | jq -r .version)
          if [ "$got" != "$VERSION" ]; then
            echo "::error::expected $VERSION, got $got"; docker logs app; exit 1
          fi
          echo "image reports version $got"

      - name: Push to ECR
        run: docker push "$IMAGE"

  tag:
    needs: [release, build-push]
    if: needs.release.outputs.existing != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag release in git
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

  deploy:
    needs: [release, tag]
    if: github.ref == 'refs/heads/main' && needs.release.outputs.existing != 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      CLUSTER: ${{ vars.ECS_CLUSTER }}
      SERVICE: ${{ vars.ECS_SERVICE }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy new image to ECS
        shell: bash
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/${{ vars.ECR_REPOSITORY }}:$VERSION"
          echo "Deploying $IMAGE"

          # לוקחים את ה-task definition הנוכחי ומחליפים רק את התמונה
          CURRENT=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$CURRENT" --query taskDefinition \
          | jq --arg IMG "$IMAGE" --arg N "$CONTAINER" '
              .containerDefinitions |= map(if .name == $N then .image = $IMG else . end)
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)' > td.json

          # רושמים revision חדש ומעדכנים את ה-service
          NEW=$(aws ecs register-task-definition --cli-input-json file://td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

          # אם ה-circuit breaker החזיר לגרסה הקודמת, ה-deploy נכשל
          LIVE=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ "$LIVE" != "$NEW" ]; then
            echo "::error::Deploy failed, ECS rolled back"; exit 1
          fi

      - name: Verify live version
        run: |
          for i in $(seq 1 20); do
            got=$(curl -fs "${{ vars.SERVICE_URL }}/version" | jq -r .version || true)
            [ "$got" = "$VERSION" ] && { echo "Live version: $got"; exit 0; }
            sleep 5
          done
          echo "::error::Live version is '$got', expected '$VERSION'"; exit 1