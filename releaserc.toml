[semantic_release]
version_toml = ["pyproject.toml:project.version:nf"]
commit_parser = "conventional"
commit_message = """
Auto commit [SKIP CI]
"""

tag_format = "v{version}"
[semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "build", "ci", "chore", "refactor", "docs", "style", "test", "revert"]


[semantic_release.branches.main]
match = "(main)"
active = true
prerelease = false


[semantic_release.branches.task]
match = "(task)"
active = true
prerelease = false


[semantic_release.remote]
type = "github"
domain = "https://github.com"
ignore_token_for_push = true